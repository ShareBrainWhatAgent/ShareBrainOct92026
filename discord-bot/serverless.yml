# Serverless Framework configuration for AWS Lambda
service: sharebrain-discord-bot

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'us-east-1'}
  
  environment:
    DISCORD_BOT_TOKEN: ${env:DISCORD_BOT_TOKEN}
    DISCORD_CLIENT_ID: ${env:DISCORD_CLIENT_ID}
    SHAREBRAIN_API_BASE_URL: ${env:SHAREBRAIN_API_BASE_URL}
    SHAREBRAIN_API_KEY: ${env:SHAREBRAIN_API_KEY}
    DEFAULT_AGENT_ID: ${env:DEFAULT_AGENT_ID}

functions:
  discordBot:
    handler: serverless-handler.handler
    timeout: 30
    events:
      - schedule: rate(5 minutes) # Keep lambda warm
    reservedConcurrency: 1

plugins:
  - serverless-offline

custom:
  serverless-offline:
    host: 0.0.0.0
    port: 3000